name: Temporary price guide font update
on:
  push:
    branches: [price-guide-pairing]
    paths: [.github/workflows/tmp-price-guide-font.yml]
permissions:
  contents: write
jobs:
  update-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: price-guide-pairing
      - name: Slightly enlarge size and price labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.quick-price-size{grid-area:name;font-weight:800;color:#fff;font-size:13px;margin:0}', '.quick-price-size{grid-area:name;font-weight:800;color:#fff;font-size:14px;margin:0}', 1)
          s=s.replace('.quick-price-detail:nth-child(3){grid-area:price;color:#fff;font-size:13px;font-weight:800;text-align:left}', '.quick-price-detail:nth-child(3){grid-area:price;color:#fff;font-size:14px;font-weight:800;text-align:left}', 1)
          s=s.replace('.quick-price-size{font-size:12.5px}', '.quick-price-size{font-size:13.5px}', 1)
          s=s.replace('.quick-price-detail:nth-child(3){font-size:12.5px}', '.quick-price-detail:nth-child(3){font-size:13.5px}', 1)
          s=s.replace('v0.9.9','v0.9.10',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Slightly enlarge price guide labels"
          git push origin HEAD:price-guide-pairing
