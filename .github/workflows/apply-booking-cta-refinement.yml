name: Apply booking CTA refinement

on:
  push:
    branches:
      - blue-gradient-cta
    paths:
      - '.github/workflows/apply-booking-cta-refinement.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blue-gradient-cta
      - name: Refine booking CTAs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old_css='''.booking-cta{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;margin:30px 0 24px;padding:18px 50px 18px 18px;background:#53606b;color:#fff;text-decoration:none;border:0;border-radius:999px;font-size:16px;font-weight:800;line-height:1.2;letter-spacing:-.01em;box-shadow:0 4px 12px rgba(17,24,39,.12);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}\n.booking-cta::after{content:"→";position:absolute;right:18px;top:50%;transform:translateY(-52%);font-size:21px;font-weight:500;line-height:1}\n.booking-cta:active{background:#46515b;transform:scale(.985);box-shadow:0 2px 8px rgba(17,24,39,.10)}'''
          new_css='''.booking-cta{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;margin:30px 0 24px;padding:18px 50px 18px 18px;background:#62a5e8;color:#fff;text-decoration:none;border:0;border-radius:999px;font-size:16px;font-weight:800;line-height:1.2;letter-spacing:-.01em;box-shadow:none;transition:transform .16s ease,background .16s ease}\n.booking-cta::after{content:"→";position:absolute;right:18px;top:50%;transform:translateY(-52%);font-size:21px;font-weight:500;line-height:1}\n.booking-cta:active{background:#5598dc;transform:scale(.985);box-shadow:none}\n.section-booking-cta{margin:42px 0 42px}'''
          if old_css not in s:
              raise SystemExit('CTA CSS target not found')
          s=s.replace(old_css,new_css)

          old_div='<div class="section-divider" aria-hidden="true"></div>'
          new_div='<a id="sectionBookingLink" class="booking-cta section-booking-cta" href="#" data-i18n="bookingCta">Booking Form</a>'
          if old_div not in s:
              raise SystemExit('section divider target not found')
          s=s.replace(old_div,new_div,1)

          s=s.replace("bookingCta:'予約へ進む'","bookingCta:'予約フォームはこちら'")
          s=s.replace("bookingCta:'Continue to Booking'","bookingCta:'Booking Form'")
          s=s.replace("bookingCta:'Continue to Booking Form'","bookingCta:'Booking Form'")

          old_links="""  $('sizeBookingLink').href=bookingUrl;\n  $('budgetBookingLink').href=bookingUrl;"""
          new_links="""  $('sizeBookingLink').href=bookingUrl;\n  $('budgetBookingLink').href=bookingUrl;\n  $('sectionBookingLink').href=bookingUrl;"""
          if old_links not in s:
              raise SystemExit('booking link assignment target not found')
          s=s.replace(old_links,new_links)

          s=s.replace('v0.9.3-muted','v0.9.4')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine booking CTA color and placement"
          git push origin HEAD:blue-gradient-cta