name: Delete obsolete branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/delete-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in price-time-display redesign-v2 segment-border-refine; do
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" || true
          done
