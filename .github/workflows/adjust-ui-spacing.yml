name: Adjust UI spacing

on:
  push:
    paths:
      - '.github/workflows/adjust-ui-spacing.yml'

permissions:
  contents: write

jobs:
  adjust-spacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Increase spacing between pricing guide and simulator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.simulator-title{font-size:22px;line-height:1.25;font-weight:800;margin:30px 2px 0}'
          new = '.simulator-title{font-size:22px;line-height:1.25;font-weight:800;margin:52px 2px 0}'
          if old not in s:
              raise SystemExit('Target CSS was not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Increase spacing between pricing sections"
          git push
