name: Refine segment corners

on:
  push:
    branches:
      - price-time-display
    paths:
      - '.github/workflows/refine-segment-corners.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: price-time-display

      - name: Refine segmented control styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.segment{display:grid;grid-template-columns:1fr 1fr;gap:3px;max-width:732px;margin:auto;padding:3px;background:#171717;border:1px solid #262626;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}'
          new='.segment{display:grid;grid-template-columns:1fr 1fr;gap:2px;max-width:732px;margin:auto;padding:2px;background:#171717;border:1px solid #262626;border-radius:9px;box-shadow:0 1px 2px rgba(0,0,0,.08)}'
          if old not in s: raise SystemExit('segment target not found')
          s=s.replace(old,new,1)
          old='.segment button{border:0;border-radius:9px;background:transparent;color:#bdbdbd;font:inherit;font-size:14px;font-weight:700;padding:10px 8px;cursor:pointer}'
          new='.segment button{border:0;border-radius:7px;background:transparent;color:#bdbdbd;font:inherit;font-size:14px;font-weight:700;padding:10px 8px;cursor:pointer}'
          if old not in s: raise SystemExit('button target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine segmented control borders and corners"
          git push origin price-time-display
