name: Update price heading

on:
  push:
    paths:
      - '.github/workflows/update-price-heading.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update price heading labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("quickPriceGuide:'料金の目安'", "quickPriceGuide:'料金'"),
            ("quickPriceGuide:'Quick Price Guide'", "quickPriceGuide:'Price'"),
            ('data-i18n="quickPriceGuide">Quick Price Guide', 'data-i18n="quickPriceGuide">Price'),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Target not found: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rename price guide heading"
          git push
