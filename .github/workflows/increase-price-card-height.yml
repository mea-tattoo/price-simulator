name: Increase price card height

on:
  push:
    paths:
      - '.github/workflows/increase-price-card-height.yml'

permissions:
  contents: write

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Increase vertical spacing in price card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('.quick-price-guide{background:#171717;border:1px solid #262626;border-radius:16px;margin-top:14px;padding:14px 16px;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}', '.quick-price-guide{background:#171717;border:1px solid #262626;border-radius:16px;margin-top:14px;padding:22px 16px;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}'),
            ('.quick-price-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;line-height:1.4}', '.quick-price-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0;font-size:13px;line-height:1.4}'),
            ('.quick-price-note{margin-top:8px;color:#b8b8b8;font-size:11px;line-height:1.5}', '.quick-price-note{margin-top:12px;color:#b8b8b8;font-size:11px;line-height:1.5}'),
            ('.quick-price-guide{padding:13px 14px}', '.quick-price-guide{padding:21px 14px}'),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Target not found: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Increase price card vertical spacing"
          git push
