name: Refine segment border to 1.3px

on:
  push:
    branches:
      - segment-border-refine
    paths:
      - '.github/workflows/refine-segment-border-13px.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: segment-border-refine
      - name: Update segment border width
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='border:.7px solid #262626;border-radius:4px'
          new='border:1.3px solid #262626;border-radius:4px'
          if old not in s:
              raise SystemExit('segment border target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Increase segment border to 1.3px"
          git push origin segment-border-refine
