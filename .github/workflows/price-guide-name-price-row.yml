name: Price guide name and price row

on:
  push:
    branches:
      - price-time-display
    paths:
      - '.github/workflows/price-guide-name-price-row.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: price-time-display

      - name: Update price guide hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_css='''.quick-price-row{display:grid;grid-template-columns:1.08fr .92fr;grid-template-areas:"name size" "price time";column-gap:12px;row-gap:3px;align-items:baseline;padding:9px 0;line-height:1.35}
.quick-price-row+.quick-price-row{border-top:1px solid rgba(255,255,255,.12)}
.quick-price-size{grid-area:name;font-weight:800;color:#fff;font-size:13px;margin:0}
.quick-price-detail{color:#d2d2d2;font-size:11.5px;line-height:1.35;white-space:nowrap}
.quick-price-detail:nth-child(2){grid-area:size}
.quick-price-detail:nth-child(3){grid-area:price}
.quick-price-detail:nth-child(4){grid-area:time}
.quick-price-detail+.quick-price-detail{margin-top:0}'''
          new_css='''.quick-price-row{display:grid;grid-template-columns:1.08fr .92fr;grid-template-areas:"name price" "size time";column-gap:12px;row-gap:4px;align-items:baseline;padding:9px 0;line-height:1.35}
.quick-price-row+.quick-price-row{border-top:1px solid rgba(255,255,255,.12)}
.quick-price-size{grid-area:name;font-weight:800;color:#fff;font-size:13px;margin:0}
.quick-price-detail{color:#d2d2d2;font-size:11.5px;line-height:1.35;white-space:nowrap}
.quick-price-detail:nth-child(2){grid-area:size}
.quick-price-detail:nth-child(3){grid-area:price;color:#fff;font-size:13px;font-weight:800}
.quick-price-detail:nth-child(4){grid-area:time}
.quick-price-detail+.quick-price-detail{margin-top:0}'''
          if old_css not in s: raise SystemExit('CSS target not found')
          s=s.replace(old_css,new_css,1)

          replacements={
            "quickXSPrice:'料金：約¥17,000'":"quickXSPrice:'約¥17,000'",
            "quickSPrice:'料金：¥22,000〜¥35,000'":"quickSPrice:'¥22,000〜¥35,000'",
            "quickMPrice:'料金：¥45,000〜¥65,000'":"quickMPrice:'¥45,000〜¥65,000'",
            "quickLPrice:'料金：¥70,000〜¥100,000'":"quickLPrice:'¥70,000〜¥100,000'",
            "quickXSPrice:'Price: about ¥17,000'":"quickXSPrice:'about ¥17,000'",
            "quickSPrice:'Price: ¥22,000–¥35,000'":"quickSPrice:'¥22,000–¥35,000'",
            "quickMPrice:'Price: ¥45,000–¥65,000'":"quickMPrice:'¥45,000–¥65,000'",
            "quickLPrice:'Price: ¥70,000–¥100,000'":"quickLPrice:'¥70,000–¥100,000'",
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'text target not found: {old}')
            s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Place price beside size label"
          git push origin price-time-display
