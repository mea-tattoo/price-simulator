name: 一時的な表記更新

on:
  push:
    paths:
      - '.github/workflows/一時的な表記更新.yml'

permissions:
  contents: write

jobs:
  update-labels-and-versions:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 表記とバージョンを更新
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          replacements = {
              "shape:'形状'": "shape:'縦横比'",
              '>v0.9.11<': '>v0.9.12<',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'index.html: not found: {old}')
              text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')

          artist = Path('artist.html')
          text = artist.read_text(encoding='utf-8')
          replacements = {
              '形状補正一覧': '縦横比補正一覧',
              'Shape: ${LABEL_EN.shape[c.shape]}': 'Proportions: ${LABEL_EN.shape[c.shape]}',
              '形状：${LABEL.shape[c.shape]}': '縦横比：${LABEL.shape[c.shape]}',
              'Version 0.3.29': 'Version 0.3.30',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'artist.html: not found: {old}')
              text = text.replace(old, new)
          artist.write_text(text, encoding='utf-8')

      - name: 一時ワークフローを削除して反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm '.github/workflows/一時的な表記更新.yml'
          git add index.html artist.html
          git commit -m '縦横比表記に統一しバージョン更新'
          git push
