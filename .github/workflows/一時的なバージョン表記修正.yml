name: 一時的なバージョン表記修正

on:
  push:
    paths:
      - '.github/workflows/一時的なバージョン表記修正.yml'

permissions:
  contents: write

jobs:
  fix-version-labels:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: バージョン表記を単純連番へ変更
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          if '>v0.9.12<' not in text:
              raise SystemExit('index.html: v0.9.12 not found')
          index.write_text(text.replace('>v0.9.12<', '>v1<'), encoding='utf-8')

          artist = Path('artist.html')
          text = artist.read_text(encoding='utf-8')
          if 'Version 0.3.30' not in text:
              raise SystemExit('artist.html: Version 0.3.30 not found')
          artist.write_text(text.replace('Version 0.3.30', 'v1'), encoding='utf-8')

      - name: 一時ワークフローを削除して反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm '.github/workflows/一時的なバージョン表記修正.yml'
          git add index.html artist.html
          git commit -m 'バージョン表記をv単純連番に統一'
          git push
