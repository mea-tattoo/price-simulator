name: Update price guide copy

on:
  push:
    paths:
      - '.github/workflows/update-price-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update price guide labels and simulator description
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ('.simulator-title{font-size:22px;line-height:1.25;font-weight:800;margin:52px 2px 0}', '.simulator-title{font-size:22px;line-height:1.25;font-weight:800;margin:52px 2px 0}\n.simulator-description{margin:6px 2px 0;color:var(--muted);font-size:13px;line-height:1.5}'),
            ('<h2 id="appTitle" class="simulator-title" data-i18n="title">Price Simulator</h2>\n\n<div class="top-segment-wrap">', '<h2 id="appTitle" class="simulator-title" data-i18n="title">Price Simulator</h2>\n<p class="simulator-description" data-i18n="simulatorDescription">Get a more detailed price estimate.</p>\n\n<div class="top-segment-wrap">'),
            ("quickXSSize:'XS — 約3cm'", "quickXSSize:'XSサイズ — 約3cm'"),
            ("quickSSize:'S — 約6cm'", "quickSSize:'Sサイズ — 約6cm'"),
            ("quickMSize:'M — 約12cm'", "quickMSize:'Mサイズ — 約12cm'"),
            ("quickLSize:'L — 約20cm'", "quickLSize:'Lサイズ — 約20cm'"),
            ("quickPriceNote:'料金はあくまで目安です。デザインによって異なります。',", "quickPriceNote:'料金はあくまで目安です。デザインによって異なります。',\n    simulatorDescription:'より詳細な料金をもとめられます。',"),
            ("quickXSSize:'XS — about 3 cm (1.2 in)'", "quickXSSize:'XS size — about 3 cm (1.2 in)'"),
            ("quickSSize:'S — about 6 cm (2.5 in)'", "quickSSize:'S size — about 6 cm (2.5 in)'"),
            ("quickMSize:'M — about 12 cm (5 in)'", "quickMSize:'M size — about 12 cm (5 in)'"),
            ("quickLSize:'L — about 20 cm (8 in)'", "quickLSize:'L size — about 20 cm (8 in)'"),
            ("quickPriceNote:'Prices are estimates and may vary depending on the design.',", "quickPriceNote:'Prices are estimates and may vary depending on the design.',\n    simulatorDescription:'Get a more detailed price estimate.',"),
            ('data-i18n="quickXSSize">XS — about 3 cm (1.2 in)', 'data-i18n="quickXSSize">XS size — about 3 cm (1.2 in)'),
            ('data-i18n="quickSSize">S — about 6 cm (2.5 in)', 'data-i18n="quickSSize">S size — about 6 cm (2.5 in)'),
            ('data-i18n="quickMSize">M — about 12 cm (5 in)', 'data-i18n="quickMSize">M size — about 12 cm (5 in)'),
            ('data-i18n="quickLSize">L — about 20 cm (8 in)', 'data-i18n="quickLSize">L size — about 20 cm (8 in)'),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Target not found: {old}')
            s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update price guide labels and simulator description"
          git push
