name: Add section divider

on:
  push:
    paths:
      - '.github/workflows/add-section-divider.yml'

permissions:
  contents: write

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add divider with equal spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ('.simulator-title{font-size:22px;line-height:1.25;font-weight:800;margin:52px 2px 0}', '.section-divider{height:1px;background:var(--line);margin:52px 2px}\n.simulator-title{font-size:22px;line-height:1.25;font-weight:800;margin:0 2px}'),
            ('</section>\n\n<h2 id="appTitle" class="simulator-title" data-i18n="title">Price Simulator</h2>', '</section>\n\n<div class="section-divider" aria-hidden="true"></div>\n\n<h2 id="appTitle" class="simulator-title" data-i18n="title">Price Simulator</h2>'),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Target not found: {old}')
            s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add divider between price and simulator sections"
          git push
