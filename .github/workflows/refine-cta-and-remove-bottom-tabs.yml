name: Refine CTA and remove bottom tabs

on:
  push:
    branches:
      - blue-gradient-cta
    paths:
      - '.github/workflows/refine-cta-and-remove-bottom-tabs.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blue-gradient-cta
      - name: Refine CTA, separator, and tabs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          s=s.replace('main{max-width:760px;margin:auto;padding:18px 14px calc(110px + env(safe-area-inset-bottom))}',
                      'main{max-width:760px;margin:auto;padding:18px 14px calc(28px + env(safe-area-inset-bottom))}')
          s=s.replace('.bottom-segment-wrap{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}\n','')

          old_css='''.booking-cta{position:relative;display:flex;align-items:center;justify-content:center;width:60%;min-height:52px;margin:45px auto;padding:15px 46px 15px 18px;background:#7fb8f0;color:#fff;text-decoration:none;border:0;border-radius:999px;font-size:16px;font-weight:600;line-height:1.2;letter-spacing:-.01em;box-shadow:none;transition:transform .16s ease,background .16s ease}\n.booking-cta::after{content:"→";position:absolute;right:18px;top:50%;transform:translateY(-52%);font-size:21px;font-weight:500;line-height:1}\n.booking-cta:active{background:#72ace5;transform:scale(.985);box-shadow:none}\n.section-booking-cta{margin:45px auto}'''
          new_css='''.booking-cta{position:relative;display:flex;align-items:center;justify-content:center;width:60%;min-height:50px;margin:45px auto;padding:14px 42px 14px 18px;background:#3484d2;color:#fff;text-decoration:none;border:0;border-radius:999px;font-size:14px;font-weight:600;line-height:1.2;letter-spacing:-.01em;box-shadow:none;transition:transform .16s ease,background .16s ease}\n.booking-cta::after{content:"→";position:absolute;right:17px;top:50%;transform:translateY(-52%);font-size:16px;font-weight:500;line-height:1}\n.booking-cta:active{background:#2d74ba;transform:scale(.985);box-shadow:none}\n.section-booking-cta{margin:45px auto 0}\n.section-transition{height:1px;background:var(--line);margin:58px 2px 18px}'''
          if old_css not in s:
              raise SystemExit('CTA CSS target not found')
          s=s.replace(old_css,new_css)

          old_top='''<a id="sectionBookingLink" class="booking-cta section-booking-cta" href="#" data-i18n="bookingCta">Booking Form</a>\n\n<h2 id="appTitle" class="simulator-title" data-i18n="title">Price Simulator</h2>'''
          new_top='''<a id="sectionBookingLink" class="booking-cta section-booking-cta" href="#" data-i18n="bookingCta">Booking Form</a>\n<div class="section-transition" aria-hidden="true"></div>\n\n<h2 id="appTitle" class="simulator-title" data-i18n="title">Price Simulator</h2>'''
          if old_top not in s:
              raise SystemExit('top booking target not found')
          s=s.replace(old_top,new_top,1)

          bottom='''<div class="bottom-segment-wrap">\n  <div id="estimateMethodTabsBottom" class="segment" role="tablist" data-i18n-aria="estimateMethod">\n    <button id="tabSizeBottom" class="active" type="button" role="tab" aria-selected="true" data-i18n="tabSize">Estimate by Size</button>\n    <button id="tabBudgetBottom" type="button" role="tab" aria-selected="false" data-i18n="tabBudget">Estimate by Budget</button>\n  </div>\n</div>\n\n'''
          if bottom not in s:
              raise SystemExit('bottom tabs target not found')
          s=s.replace(bottom,'',1)

          old_mode="""const modeButtons={\n  size:[$('tabSizeTop'),$('tabSizeBottom')],\n  budget:[$('tabBudgetTop'),$('tabBudgetBottom')]\n};"""
          new_mode="""const modeButtons={\n  size:[$('tabSizeTop')],\n  budget:[$('tabBudgetTop')]\n};"""
          if old_mode not in s:
              raise SystemExit('modeButtons target not found')
          s=s.replace(old_mode,new_mode,1)

          s=s.replace('v0.9.5','v0.9.6')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine booking CTA and remove fixed bottom tabs"
          git push origin HEAD:blue-gradient-cta
