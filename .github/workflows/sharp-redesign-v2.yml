name: Sharp redesign v2

on:
  push:
    branches:
      - redesign-v2
    paths:
      - '.github/workflows/sharp-redesign-v2.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign-v2

      - name: Apply sharp visual language
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
:root{
  --paper:#f5f5f3;
  --surface:#ffffff;
  --surface-2:#fafafa;
  --ink:#0a0a0a;
  --text:#0a0a0a;
  --muted:#6d6d6d;
  --line:#cfcfcb;
  --line-strong:#9b9b97;
  --danger-bg:#fff1f2;
  --danger-line:#fecaca;
  --danger-text:#991b1b;
}
*{box-sizing:border-box}
html{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--paper);
  color:var(--text);
  -webkit-text-size-adjust:100%;
}
body{margin:0;background:var(--paper)}
main{width:min(100%,780px);margin:0 auto;padding:28px 18px calc(126px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
h1{margin:0;font-size:28px;line-height:1.05;font-weight:880;letter-spacing:-.05em;white-space:nowrap}
.language-toggle{
  flex:none;
  border:0;
  border-bottom:1px solid var(--ink);
  border-radius:0;
  background:transparent;
  color:#3f3f3f;
  font:inherit;
  font-size:12px;
  font-weight:780;
  padding:6px 0 4px;
  cursor:pointer;
}
.quick-price-guide{
  position:relative;
  overflow:hidden;
  background:var(--ink);
  color:#fff;
  border:1px solid var(--ink);
  border-radius:2px;
  padding:22px 18px 20px;
  box-shadow:none;
}
.quick-price-guide::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:72px;
  height:3px;
  background:#fff;
}
.quick-price-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  padding:14px 0;
  font-size:14px;
  line-height:1.28;
}
.quick-price-row+.quick-price-row{border-top:1px solid #343434}
.quick-price-size{min-width:0;color:#f6f6f6;font-weight:760;letter-spacing:-.018em}
.quick-price-value{flex:none;color:#fff;font-weight:860;text-align:right;white-space:nowrap;letter-spacing:-.025em}
.quick-price-note{margin-top:8px;padding-top:15px;border-top:1px solid #343434;color:#aaa;font-size:11px;line-height:1.5}
.section-divider{height:1px;margin:56px 0;background:#b7b7b3;position:relative}
.section-divider::before{content:"";position:absolute;left:0;top:-2px;width:34px;height:5px;background:var(--ink)}
.simulator-title{margin:0;font-size:25px;line-height:1.08;font-weight:880;letter-spacing:-.045em}
.simulator-description{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.top-segment-wrap{margin-top:19px}
.segment{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  width:100%;
  max-width:744px;
  margin:auto;
  padding:0;
  border:1px solid var(--ink);
  border-radius:2px;
  background:var(--ink);
  box-shadow:none;
}
.segment button{
  min-height:48px;
  border:0;
  border-radius:0;
  background:var(--ink);
  color:#aaa;
  font:inherit;
  font-size:14px;
  font-weight:800;
  letter-spacing:-.018em;
  padding:10px 8px;
  cursor:pointer;
}
.segment button+button{border-left:1px solid #3b3b3b}
.segment button.active{background:#fff;color:#0a0a0a;box-shadow:none}
.bottom-segment-wrap{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  margin:0;
  padding:10px 18px calc(10px + env(safe-area-inset-bottom));
  background:rgba(245,245,243,.94);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid #d2d2ce;
}
.pane{margin-top:16px;padding:0;border:1px solid var(--line-strong);border-radius:2px;background:var(--surface);box-shadow:none}
.pane.hidden{display:none!important}
.step{margin:0;padding:19px 18px;border:0;border-radius:0;background:var(--surface)}
.step+.step{border-top:1px solid var(--line)}
h2{margin:0 0 13px;font-size:16px;line-height:1.25;font-weight:840;letter-spacing:-.025em}
.kicker{font-size:10px;color:var(--muted);font-weight:850;letter-spacing:.12em;text-transform:uppercase}
select{
  width:100%;
  border:1px solid var(--line-strong);
  border-radius:1px;
  background:#fff;
  color:var(--text);
  font-size:16px;
  padding:13px 11px;
  box-shadow:none;
}
.helper{margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line);border-radius:0;background:transparent;color:var(--muted);font-size:12px;line-height:1.58}
.helper-title{margin-bottom:7px;color:#696969;font-size:9.5px;font-weight:880;letter-spacing:.13em}
.helper-row{display:flex;align-items:baseline;gap:6px}
.helper-row+.helper-row{margin-top:4px}
.helper-label{font-weight:780;color:#444;white-space:nowrap}
.helper-sep{color:#999;white-space:nowrap}
.helper-example{min-width:0}
.slider-head{display:flex;justify-content:flex-end;margin-bottom:10px}
.slider-value{font-size:29px;font-weight:900;letter-spacing:-.05em;white-space:nowrap}
.slider-value span{margin-left:4px;color:var(--muted);font-size:13px;font-weight:680;letter-spacing:0}
.range-wrap{padding:6px 1px 0}
input[type="range"]{
  width:100%;
  height:22px;
  margin:0;
  background:transparent;
  appearance:none;
  -webkit-appearance:none;
}
input[type="range"]::-webkit-slider-runnable-track{height:2px;background:#cfcfcb}
input[type="range"]::-webkit-slider-thumb{
  width:16px;
  height:16px;
  margin-top:-7px;
  border:2px solid var(--ink);
  border-radius:0;
  background:#fff;
  -webkit-appearance:none;
  transform:rotate(45deg);
  box-shadow:none;
}
input[type="range"]::-moz-range-track{height:2px;background:#cfcfcb;border:0}
input[type="range"]::-moz-range-progress{height:2px;background:var(--ink)}
input[type="range"]::-moz-range-thumb{width:14px;height:14px;border:2px solid var(--ink);border-radius:0;background:#fff;transform:rotate(45deg)}
.range-scale{display:flex;justify-content:space-between;margin-top:5px;color:var(--muted);font-size:11px}
.validation{margin-top:10px;padding:10px 11px;border:1px solid var(--danger-line);border-radius:0;background:var(--danger-bg);color:var(--danger-text);font-size:12px;line-height:1.5}
.size-input-card{display:grid;grid-template-columns:1fr auto;grid-template-areas:"title value" "range range" "validation validation";align-items:end;column-gap:14px}
.size-input-card>h2{grid-area:title;margin:0 0 11px}
.size-input-card>.slider-head{grid-area:value;margin:0 0 11px}
.size-input-card>.range-wrap{grid-area:range}
.size-input-card>.validation{grid-area:validation}
.final,.result{margin:0;padding:20px 18px;border:0;border-top:2px solid var(--ink);border-radius:0;background:var(--ink);color:#fff;box-shadow:none}
.final .kicker{color:#aaa}
.final .amount{margin-top:4px;color:#fff;font-size:36px;font-weight:900;letter-spacing:-.055em}
.final.is-placeholder .kicker,.final.is-placeholder .amount,.result.is-placeholder .main-label,.result.is-placeholder .dimension-name,.result.is-placeholder .dimension-value{color:#666}
.estimate-note{margin-top:12px;padding:11px 0 0;border:0;border-top:1px solid #3a3a3a;border-radius:0;background:transparent;color:#bbb;font-size:12px;line-height:1.5}
.result .main-label{color:#aaa;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.result .size{margin-top:12px}
.dimension-line{display:flex;align-items:baseline;gap:9px;line-height:1.2;white-space:nowrap}
.dimension-line+.dimension-line{margin-top:8px}
.dimension-name{color:#ededed;font-size:15px;font-weight:760}
.dimension-value{color:#fff;font-size:28px;font-weight:900;letter-spacing:-.045em}
.actions{display:flex;gap:8px;margin:0;padding:14px 18px 18px;border-top:1px solid var(--line)}
.actions button{border:1px solid var(--ink);border-radius:0;background:#fff;color:#111;font:inherit;font-size:12px;font-weight:800;padding:9px 13px;cursor:pointer}
.budget-sticky{position:sticky;top:0;z-index:30;padding:0;background:#fff;border-radius:0;border-bottom:1px solid var(--line)}
.budget-card{margin:0}
.budget-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:11px}
.budget-title h2{margin:0}
.budget-value{font-size:30px;font-weight:900;letter-spacing:-.05em;white-space:nowrap}
.hidden{display:none!important}
@media(max-width:520px){
  main{padding:22px 14px calc(122px + env(safe-area-inset-bottom))}
  h1{font-size:25px}
  .language-toggle{font-size:12px}
  .quick-price-guide{padding:21px 15px 19px}
  .quick-price-row{gap:9px;padding:13px 0;font-size:12.5px}
  .quick-price-note{font-size:10.8px}
  .section-divider{margin:50px 0}
  .simulator-title{font-size:23px}
  .segment button{min-height:46px;font-size:13.5px}
  .step{padding:17px 15px}
  .slider-value{font-size:28px}
  .final .amount{font-size:34px}
  .dimension-value{font-size:27px}
  .dimension-name{font-size:15px}
  .actions{padding:13px 15px 16px}
  .bottom-segment-wrap{padding-left:14px;padding-right:14px}
}
@media(max-width:390px){
  .quick-price-row{font-size:12px}
  .quick-price-size{max-width:60%}
  .quick-price-value{font-size:11.7px}
  .helper{font-size:11.5px}
}
'''

          new_s, count = re.subn(r'<style>.*?</style>', '<style>\n' + css.strip() + '\n</style>', s, count=1, flags=re.S)
          if count != 1:
            raise SystemExit('style replacement failed')
          p.write_text(new_s, encoding='utf-8')
          PY

      - name: Commit preview redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make redesign sharper and needle-inspired"
          git push origin redesign-v2
