name: Apply compact price guide

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-compact-price-guide.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: price-time-display
          fetch-depth: 0

      - name: Compact price guide layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=""".quick-price-guide{background:#171717;border:1px solid #262626;border-radius:0;margin-top:14px;padding:22px 16px;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.quick-price-row{display:block;padding:15px 0;line-height:1.45}
.quick-price-row+.quick-price-row{border-top:1px solid rgba(255,255,255,.12)}
.quick-price-size{font-weight:800;color:#fff;font-size:14px;margin-bottom:7px}
.quick-price-detail{color:#d2d2d2;font-size:12.5px;line-height:1.55}
.quick-price-detail+.quick-price-detail{margin-top:2px}
.quick-price-note{margin-top:12px;color:#b8b8b8;font-size:11px;line-height:1.5;font-weight:700}"""
          new=""".quick-price-guide{background:#171717;border:1px solid #262626;border-radius:0;margin-top:14px;padding:14px 16px 13px;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.quick-price-row{display:grid;grid-template-columns:1.08fr .92fr;grid-template-areas:\"name size\" \"price time\";column-gap:12px;row-gap:3px;align-items:baseline;padding:9px 0;line-height:1.35}
.quick-price-row+.quick-price-row{border-top:1px solid rgba(255,255,255,.12)}
.quick-price-size{grid-area:name;font-weight:800;color:#fff;font-size:13px;margin:0}
.quick-price-detail{color:#d2d2d2;font-size:11.5px;line-height:1.35;white-space:nowrap}
.quick-price-detail:nth-child(2){grid-area:size}
.quick-price-detail:nth-child(3){grid-area:price}
.quick-price-detail:nth-child(4){grid-area:time}
.quick-price-detail+.quick-price-detail{margin-top:0}
.quick-price-note{margin-top:7px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);color:#b8b8b8;font-size:10.5px;line-height:1.4;font-weight:700}"""
          if old not in s: raise SystemExit('price guide CSS target not found')
          s=s.replace(old,new,1)
          old_media='@media(max-width:390px){h1{font-size:22px}.simulator-title{font-size:22px}.quick-price-guide{padding:21px 14px}.quick-price-size{font-size:13px}.quick-price-detail{font-size:12px}'
          new_media='@media(max-width:390px){h1{font-size:22px}.simulator-title{font-size:22px}.quick-price-guide{padding:13px 14px 12px}.quick-price-size{font-size:12.5px}.quick-price-detail{font-size:11px}'
          if old_media not in s: raise SystemExit('mobile CSS target not found')
          s=s.replace(old_media,new_media,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit branch update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Compact price guide layout"
          git push origin price-time-display
