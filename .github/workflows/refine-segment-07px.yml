name: Refine segment to 0.7px

on:
  push:
    branches:
      - segment-border-refine
    paths:
      - '.github/workflows/refine-segment-07px.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: segment-border-refine
      - name: Refine segmented control
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.segment{display:grid;grid-template-columns:1fr 1fr;gap:2px;max-width:732px;margin:auto;padding:2px;background:#171717;border:1px solid #262626;border-radius:9px;box-shadow:0 1px 2px rgba(0,0,0,.08)}\n.segment button{border:0;border-radius:7px;background:transparent;color:#bdbdbd;font:inherit;font-size:14px;font-weight:700;padding:10px 8px;cursor:pointer}'
          new='.segment{display:grid;grid-template-columns:1fr 1fr;gap:.7px;max-width:732px;margin:auto;padding:.7px;background:#171717;border:.7px solid #262626;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08)}\n.segment button{border:0;border-radius:3.3px;background:transparent;color:#bdbdbd;font:inherit;font-size:14px;font-weight:700;padding:10px 8px;cursor:pointer}'
          if old not in s:
              raise SystemExit('segment CSS target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine segment border and corners"
          git push origin segment-border-refine