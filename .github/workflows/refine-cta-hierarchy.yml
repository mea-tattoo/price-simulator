name: Refine typography hierarchy and booking CTA

on:
  push:
    branches:
      - segment-border-refine
    paths:
      - '.github/workflows/refine-cta-hierarchy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: segment-border-refine
      - name: Update UI hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.final .amount{font-size:34px;', '.final .amount{font-size:28px;')
          s=s.replace('.dimension-value{font-size:27px;', '.dimension-value{font-size:22px;')
          s=s.replace('.slider-value{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;font-size:24px;', '.slider-value{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;font-size:20px;')
          s=s.replace('.budget-value{font-size:29px;', '.budget-value{font-size:24px;')
          s=s.replace('.booking-cta{display:flex;align-items:center;justify-content:center;width:100%;margin-top:14px;padding:15px 16px;background:#171717;color:#fff;', '.booking-cta{display:flex;align-items:center;justify-content:center;width:100%;margin-top:18px;padding:17px 16px;background:#111;color:#fff;')
          s=s.replace('border:1.3px solid #171717;border-radius:4px;font-size:16px;', 'border:2px solid #111;border-radius:6px;font-size:17px;')
          s=s.replace('bookingCta:\'予約へ進む\'', 'bookingCta:\'予約フォームへ進む\'')
          s=s.replace('bookingCta:\'Continue to Booking\'', 'bookingCta:\'Continue to Booking Form\'')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine typography hierarchy and booking CTA"
          git push origin segment-border-refine
