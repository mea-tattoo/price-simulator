name: Apply muted CTA refinement

on:
  push:
    branches:
      - blue-gradient-cta
    paths:
      - '.github/workflows/apply-muted-cta.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blue-gradient-cta
      - name: Refine CTA color
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''.booking-cta{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;margin:30px 0 24px;padding:18px 50px 18px 18px;color:#fff;text-decoration:none;border:2px solid transparent;border-radius:999px;font-size:16px;font-weight:800;line-height:1.2;letter-spacing:-.01em;background:linear-gradient(180deg,#49bcff 0%,#1599f2 46%,#0879d8 100%) padding-box,linear-gradient(180deg,#9addff 0%,#2ea9ff 42%,#0568c7 100%) border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,65,130,.18),0 5px 14px rgba(0,104,202,.24);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}\n.booking-cta::after{content:"→";position:absolute;right:18px;top:50%;transform:translateY(-52%);font-size:21px;font-weight:500;line-height:1}\n.booking-cta:active{transform:scale(.985);filter:brightness(.97);box-shadow:inset 0 1px 0 rgba(255,255,255,.36),0 3px 10px rgba(0,104,202,.22)}'''
          new='''.booking-cta{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;margin:30px 0 24px;padding:18px 50px 18px 18px;background:#53606b;color:#fff;text-decoration:none;border:0;border-radius:999px;font-size:16px;font-weight:800;line-height:1.2;letter-spacing:-.01em;box-shadow:0 4px 12px rgba(17,24,39,.12);transition:transform .16s ease,background .16s ease,box-shadow .16s ease}\n.booking-cta::after{content:"→";position:absolute;right:18px;top:50%;transform:translateY(-52%);font-size:21px;font-weight:500;line-height:1}\n.booking-cta:active{background:#46515b;transform:scale(.985);box-shadow:0 2px 8px rgba(17,24,39,.10)}'''
          if old not in s:
              raise SystemExit('target CTA CSS not found')
          s=s.replace(old,new)
          s=s.replace('v0.9.2-blue','v0.9.3-muted')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use muted slate booking CTA"
          git push origin HEAD:blue-gradient-cta