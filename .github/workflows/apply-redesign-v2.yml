name: Apply redesign v2 branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-redesign-v2.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign-v2
          fetch-depth: 0

      - name: Replace visual design on redesign-v2
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
:root{
  --paper:#f2f2f0;
  --surface:#ffffff;
  --surface-soft:#f7f7f5;
  --ink:#111111;
  --text:#111111;
  --muted:#747474;
  --line:#dcdcd8;
  --danger-bg:#fff1f2;
  --danger-line:#fecaca;
  --danger-text:#991b1b;
}
*{box-sizing:border-box}
html{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--paper);color:var(--text);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper)}
main{width:min(100%,780px);margin:0 auto;padding:28px 18px calc(126px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
h1{margin:0;font-size:28px;line-height:1.08;font-weight:850;letter-spacing:-.045em;white-space:nowrap}
.language-toggle{flex:none;border:1px solid #d5d5d1;border-radius:999px;background:rgba(255,255,255,.78);color:#4f4f4f;font:inherit;font-size:12.5px;font-weight:750;padding:8px 12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.quick-price-guide{position:relative;overflow:hidden;background:var(--ink);color:#fff;border:1px solid #242424;border-radius:24px;padding:24px 20px 22px;box-shadow:0 18px 44px rgba(0,0,0,.14)}
.quick-price-guide::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:rgba(255,255,255,.16)}
.quick-price-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;font-size:14px;line-height:1.35}
.quick-price-row+.quick-price-row{border-top:1px solid rgba(255,255,255,.13)}
.quick-price-size{min-width:0;color:#f3f3f3;font-weight:720;letter-spacing:-.012em}
.quick-price-value{flex:none;color:#fff;font-weight:800;text-align:right;white-space:nowrap;letter-spacing:-.018em}
.quick-price-note{margin-top:8px;padding-top:16px;border-top:1px solid rgba(255,255,255,.13);color:#aaa;font-size:11.5px;line-height:1.55}
.section-divider{height:1px;margin:58px 4px;background:linear-gradient(90deg,transparent 0,var(--line) 10%,var(--line) 90%,transparent 100%)}
.simulator-title{margin:0;font-size:25px;line-height:1.15;font-weight:850;letter-spacing:-.038em}
.simulator-description{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.top-segment-wrap{margin-top:20px}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;max-width:744px;margin:auto;padding:4px;border-radius:17px;background:var(--ink);border:1px solid #232323;box-shadow:0 5px 16px rgba(0,0,0,.10)}
.segment button{min-height:48px;border:0;border-radius:13px;background:transparent;color:#aaa;font:inherit;font-size:14px;font-weight:780;letter-spacing:-.015em;padding:10px 8px;cursor:pointer}
.segment button.active{background:#fff;color:#111;box-shadow:0 2px 7px rgba(0,0,0,.18)}
.bottom-segment-wrap{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(242,242,240,.88);backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%);border-top:1px solid rgba(0,0,0,.04)}
.pane{margin-top:16px;padding:10px;border:1px solid #ddddda;border-radius:25px;background:var(--surface);box-shadow:0 14px 38px rgba(0,0,0,.055)}
.pane.hidden{display:none!important}
.step{margin-top:8px;padding:18px;border:0;border-radius:17px;background:var(--surface-soft)}
.pane>.step:first-child{margin-top:0}
h2{margin:0 0 13px;font-size:16px;line-height:1.3;font-weight:800;letter-spacing:-.022em}
.kicker{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.09em;text-transform:uppercase}
select{width:100%;border:0;border-radius:14px;background:#fff;color:var(--text);font-size:16px;padding:14px 12px;box-shadow:inset 0 0 0 1px #d6d6d2,0 1px 2px rgba(0,0,0,.025)}
.helper{margin:12px 0 0;padding:12px;border-radius:13px;background:rgba(0,0,0,.032);color:var(--muted);font-size:12px;line-height:1.6}
.helper-title{margin-bottom:7px;color:#737373;font-size:10px;font-weight:850;letter-spacing:.10em}
.helper-row{display:flex;align-items:baseline;gap:6px}
.helper-row+.helper-row{margin-top:4px}
.helper-label{font-weight:760;color:#4c4c4c;white-space:nowrap}
.helper-sep{color:#aaa;white-space:nowrap}
.helper-example{min-width:0}
.slider-head{display:flex;justify-content:flex-end;margin-bottom:10px}
.slider-value{font-size:29px;font-weight:850;letter-spacing:-.045em;white-space:nowrap}
.slider-value span{margin-left:4px;color:var(--muted);font-size:14px;font-weight:650;letter-spacing:0}
.range-wrap{padding:5px 1px 0}
input[type="range"]{width:100%;margin:0;accent-color:var(--ink)}
.range-scale{display:flex;justify-content:space-between;margin-top:5px;color:var(--muted);font-size:11px}
.validation{margin-top:10px;padding:10px 11px;border:1px solid var(--danger-line);border-radius:12px;background:var(--danger-bg);color:var(--danger-text);font-size:12px;line-height:1.5}
.size-input-card{display:grid;grid-template-columns:1fr auto;grid-template-areas:"title value" "range range" "validation validation";align-items:end;column-gap:14px}
.size-input-card>h2{grid-area:title;margin:0 0 11px}
.size-input-card>.slider-head{grid-area:value;margin:0 0 11px}
.size-input-card>.range-wrap{grid-area:range}
.size-input-card>.validation{grid-area:validation}
.final,.result{margin-top:10px;padding:20px;border:0;border-radius:19px;background:var(--ink);color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.11)}
.final .kicker{color:#bcbcbc}
.final .amount{margin-top:4px;color:#fff;font-size:36px;font-weight:860;letter-spacing:-.048em}
.final.is-placeholder .kicker,.final.is-placeholder .amount,.result.is-placeholder .main-label,.result.is-placeholder .dimension-name,.result.is-placeholder .dimension-value{color:#737373}
.estimate-note{margin-top:12px;padding:11px 12px;border:1px solid #343434;border-radius:12px;background:#202020;color:#c7c7c7;font-size:12.5px;line-height:1.55}
.result .main-label{color:#c4c4c4;font-size:12px;font-weight:760;letter-spacing:.02em}
.result .size{margin-top:12px}
.dimension-line{display:flex;align-items:baseline;gap:9px;line-height:1.25;white-space:nowrap}
.dimension-line+.dimension-line{margin-top:8px}
.dimension-name{color:#f0f0f0;font-size:16px;font-weight:720}
.dimension-value{color:#fff;font-size:28px;font-weight:850;letter-spacing:-.04em}
.actions{display:flex;gap:8px;margin:12px 2px 2px}
.actions button{border:1px solid #d4d4d0;border-radius:12px;background:transparent;color:#555;font:inherit;font-size:13px;font-weight:720;padding:10px 13px;cursor:pointer}
.budget-sticky{position:sticky;top:0;z-index:30;padding:0 0 2px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
.budget-card{margin-top:0}
.budget-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:11px}
.budget-title h2{margin:0}
.budget-value{font-size:30px;font-weight:850;letter-spacing:-.045em;white-space:nowrap}
.hidden{display:none!important}
@media(max-width:520px){main{padding:22px 14px calc(122px + env(safe-area-inset-bottom))}h1{font-size:25px}.language-toggle{font-size:12px;padding:7px 10px}.quick-price-guide{border-radius:21px;padding:21px 16px 19px}.quick-price-row{gap:9px;padding:13px 0;font-size:12.5px}.quick-price-note{font-size:11px}.section-divider{margin:50px 2px}.simulator-title{font-size:23px}.simulator-description{font-size:13px}.segment button{min-height:46px;font-size:13.5px}.pane{padding:8px;border-radius:22px}.step{padding:16px;border-radius:15px}.slider-value{font-size:28px}.final .amount{font-size:34px}.dimension-value{font-size:27px}.dimension-name{font-size:15px}.bottom-segment-wrap{padding-left:14px;padding-right:14px}}
@media(max-width:390px){.quick-price-row{font-size:12px}.quick-price-size{max-width:60%}.quick-price-value{font-size:11.8px}.helper{font-size:11.5px}}
'''

          new_s, count = re.subn(r'<style>.*?</style>', '<style>\n' + css.strip() + '\n</style>', s, count=1, flags=re.S)
          if count != 1:
            raise SystemExit('Style block replacement failed')
          p.write_text(new_s, encoding='utf-8')
          PY

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Redesign customer price simulator UI"
          git push origin redesign-v2
