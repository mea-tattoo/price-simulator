name: Update dark segment UI

on:
  push:
    paths:
      - '.github/workflows/update-dark-segment.yml'

permissions:
  contents: write

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make estimate tabs dark tone
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('.segment{display:grid;grid-template-columns:1fr 1fr;gap:3px;max-width:732px;margin:auto;padding:3px;background:#e8e9ec;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.04)}', '.segment{display:grid;grid-template-columns:1fr 1fr;gap:3px;max-width:732px;margin:auto;padding:3px;background:#171717;border:1px solid #262626;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}'),
            ('.segment button{border:0;border-radius:9px;background:transparent;color:#3f4650;font:inherit;font-size:14px;font-weight:700;padding:10px 8px;cursor:pointer}', '.segment button{border:0;border-radius:9px;background:transparent;color:#bdbdbd;font:inherit;font-size:14px;font-weight:700;padding:10px 8px;cursor:pointer}'),
            ('.segment button.active{background:white;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.12)}', '.segment button.active{background:#f5f5f5;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.22)}'),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Target not found: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use dark tone for estimate tabs"
          git push
