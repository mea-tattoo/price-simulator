name: Check pricing integration
on:
  pull_request:
  push:
    branches: [main, 'codex/pricing-*']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check:pricing
      - if: github.ref == 'refs/heads/main'
        run: node scripts/check-pricing.cjs --release
