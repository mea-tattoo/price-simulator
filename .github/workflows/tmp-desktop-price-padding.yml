name: Temporary desktop price guide spacing
on:
  push:
    branches: [main]
    paths: [.github/workflows/tmp-desktop-price-padding.yml]
permissions:
  contents: write
jobs:
  update-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Increase desktop-only vertical padding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='@media(max-width:520px){.quick-price-row{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);column-gap:18px;width:100%}.quick-price-note{width:100%}}'
          desktop='@media(min-width:521px){.quick-price-guide{padding-top:26px;padding-bottom:26px}}\n'
          if marker not in s:
              raise SystemExit('responsive marker not found')
          if desktop not in s:
              s=s.replace(marker,desktop+marker,1)
          s=s.replace('v0.9.10','v0.9.11',1)
          p.write_text(s)
          PY
      - name: Commit main update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase desktop price guide vertical spacing"
          git push origin HEAD:main
      - name: Remove merged branch
        run: git push origin --delete price-guide-pairing || true
