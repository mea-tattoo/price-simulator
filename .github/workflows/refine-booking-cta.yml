name: Refine booking CTA

on:
  push:
    branches:
      - segment-border-refine
    paths:
      - '.github/workflows/refine-booking-cta.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: segment-border-refine
      - name: Remove reset and strengthen booking CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='.actions{display:flex;gap:8px;margin-top:12px}\n.actions button{border:0;border-radius:4px;padding:11px 14px;font:inherit;font-weight:700;background:#e5e7eb;color:#111;cursor:pointer}\n.booking-cta{display:flex;align-items:center;justify-content:center;width:100%;margin-top:14px;padding:15px 16px;background:#171717;color:#fff;text-decoration:none;border:1.3px solid #171717;border-radius:4px;font-size:16px;font-weight:800;line-height:1.2;letter-spacing:-.01em}\n.booking-cta:active{background:#2a2a2a}'
          new='.booking-cta{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:18px;padding:17px 50px 17px 18px;background:#111;color:#fff;text-decoration:none;border:2px solid #111;border-radius:6px;font-size:17px;font-weight:800;line-height:1.2;letter-spacing:-.01em}\n.booking-cta::after{content:"→";position:absolute;right:18px;top:50%;transform:translateY(-52%);font-size:21px;font-weight:500;line-height:1}\n.booking-cta:active{background:#2a2a2a;transform:translateY(1px)}'
          if old not in s: raise SystemExit('CTA CSS target not found')
          s=s.replace(old,new,1)

          s=s.replace('''  <a id="sizeBookingLink" class="booking-cta" href="#" data-i18n="bookingCta">Book an Appointment</a>\n  <div class="actions"><button id="sizeReset" type="button" data-i18n="reset">Reset</button></div>''','''  <a id="sizeBookingLink" class="booking-cta" href="#" data-i18n="bookingCta">Continue to Booking</a>''',1)
          s=s.replace('''  <a id="budgetBookingLink" class="booking-cta" href="#" data-i18n="bookingCta">Book an Appointment</a>\n  <div class="actions"><button id="budgetReset" type="button" data-i18n="reset">Reset</button></div>''','''  <a id="budgetBookingLink" class="booking-cta" href="#" data-i18n="bookingCta">Continue to Booking</a>''',1)

          old="sizeNote:'表示サイズは目安です。実際のサイズとは異なる場合があります。',bookingCta:'予約フォームへ'"
          new="sizeNote:'表示サイズは目安です。実際のサイズとは異なる場合があります。',bookingCta:'予約へ進む'"
          if old not in s: raise SystemExit('JA CTA text target not found')
          s=s.replace(old,new,1)

          old="sizeNote:'The displayed size is an estimate.',bookingCta:'Book an Appointment'"
          new="sizeNote:'The displayed size is an estimate.',bookingCta:'Continue to Booking'"
          if old not in s: raise SystemExit('EN CTA text target not found')
          s=s.replace(old,new,1)

          old="""$('sizeReset').addEventListener('click',()=>{\n  sizeLength.value='80';sizeShort.value='50';sizeComplexity.value='';sizeColor.value='';recalcSize();\n});\n"""
          if old not in s: raise SystemExit('size reset JS target not found')
          s=s.replace(old,'',1)

          old="""$('budgetReset').addEventListener('click',()=>{\n  budgetShape.value='';budgetComplexity.value='';budgetColor.value='';budget.value='30000';recalcBudget();\n});\n"""
          if old not in s: raise SystemExit('budget reset JS target not found')
          s=s.replace(old,'',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine booking CTA and remove reset"
          git push origin segment-border-refine
