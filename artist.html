<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>料金計算機(アーティスト用)</title>
<meta name="apple-mobile-web-app-title" content="料金計算機(アーティスト用)">
<style>
:root{
  --bg:#fff;--card:#fff;--text:#111;--muted:#6b7280;--muted2:#9ca3af;
  --line:#e5e7eb;--soft:#f6f7f8;--soft2:#fafafa;--dark:#111827;
}
*{box-sizing:border-box}
html{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#111;color:var(--text)}
body{margin:0;background:var(--bg);min-height:100vh;overflow-x:hidden}
.app-header{position:relative;background:#111;color:#fff}
.app-header::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:100vh;background:#111}
.app-header-inner{max-width:800px;margin:auto;padding:18px;font-size:15px;font-weight:400;line-height:1.3}
main{max-width:800px;margin:auto;padding:38px 18px 48px}
.tattoo{margin-top:0}
.tattoo+.tattoo{margin-top:48px;padding-top:40px;border-top:3px solid #111}
.tattoo-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.tattoo-title{font-size:17px;font-weight:600}
.tattoo-actions{display:flex;align-items:center;gap:14px}
.text-btn{border:0;background:transparent;color:#717780;font:inherit;font-size:11px;font-weight:500;padding:6px 0;cursor:pointer}
.text-btn.remove{color:#e25563;font-weight:400}
.field{border:0;border-radius:4px;background:var(--soft);padding:16px 18px;margin-top:14px}
.field h2{font-size:15px;font-weight:600;margin:0 0 8px}
.dimension-row{display:flex;align-items:center;justify-content:space-between;gap:18px}
.dimension-row h2{margin:0}
.number-wrap{display:flex;align-items:center;gap:8px}
.current-ratio{font-size:11px;color:#858c95;white-space:nowrap}
.number-input{width:120px;font:inherit;font-size:16px;font-weight:500;border:1px solid #dfe3e8;border-radius:4px;background:#fff;padding:9px 10px;color:var(--text)}
.number-input::placeholder{color:#b3b8bf;opacity:1}
.unit{font-size:11px;color:var(--muted);font-weight:500}
select{width:100%;font-size:14px;border:1px solid #dfe3e8;border-radius:4px;background:#fff;padding:11px;color:var(--text)}
.helper{font-size:9px;color:#b2b7be;line-height:1.25;margin-top:10px}
.examples{margin-top:10px;color:#b2b7be;font-size:9px;line-height:1.25}
.examples-title{margin-bottom:4px;color:#b2b7be;font-size:9px;font-weight:500}
.example-row{display:grid;grid-template-columns:80px 16px minmax(0,1fr);gap:4px}
.example-row+.example-row{margin-top:0}
.example-row strong{color:#7b828b;font-weight:500}
.example-dots{text-align:center;color:#b2b7be}
.helper-row{display:grid;grid-template-columns:minmax(0,1fr) 46px 62px;gap:7px;padding:0}
.helper-row.current{color:#7b828b;font-weight:500}
.helper-row .rate,.helper-row .amount{text-align:right;white-space:nowrap}
.validation{font-size:10px;color:#b4232f;margin-top:7px}
.hidden{display:none!important}
[hidden]{display:none!important}
.add-wrap{display:flex;justify-content:center;margin:26px 0 0}
.add{border:0;background:#f1f2f4;color:#3d4249;border-radius:5px;font:inherit;font-size:12px;font-weight:500;padding:10px 15px;cursor:pointer}
.summary{margin-top:44px;border-top:3px solid #111;padding-top:20px}
.summary-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:16px}
.summary h2{font-size:24px;font-weight:600;margin:0}
.summary-tabs{display:inline-flex;gap:14px;margin:0;flex:0 0 auto}
.summary-tab{appearance:none;border:0;background:transparent;color:#a0a6ae;font:inherit;font-size:11px;font-weight:500;padding:4px 0;cursor:pointer}
.summary-tab[aria-selected="true"]{color:#343941;font-weight:600}
.summary-tab:focus-visible{outline:2px solid #9bbcf5;outline-offset:3px}
.summary-panels{max-width:100%}
.summary-language{--summary-gutter:18px;min-width:0;border:0;border-radius:0;background:#fff;padding:0}
.summary-item{background:#fafbfc;border-radius:4px;padding:16px var(--summary-gutter);margin-top:16px}
.summary-item:first-child{margin-top:0}
.summary-item+.summary-item{margin-top:24px}
.summary-main{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:16px;font-weight:500}
.summary-main strong{font-size:16px;font-weight:600}
.summary-detail{color:#7d858e;font-size:12px;line-height:1.55}
.summary-detail-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline}
.summary-detail-line+.summary-detail-line{margin-top:3px}
.summary-detail-value{text-align:right;white-space:nowrap}
.summary-detail+.summary-main{margin-top:14px}
.summary-totals{margin-top:20px;padding:2px var(--summary-gutter) 0;color:var(--text)}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 0;font-size:16px;font-weight:500}
.sum-row strong{font-weight:600}
.sum-row.discount{color:#55a95d}
.sum-row.total{margin-top:7px;padding-top:14px;font-size:24px;font-weight:600;border-top:1px dashed #cfd3d8;color:#111}
.sum-row.total strong{font-weight:600}
.app-footer{display:flex;flex-direction:column;align-items:center;margin-top:108px;padding:22px 0 40px;color:#b7bdc5}
.app-footer img{display:block;width:44px;height:auto}
.copyright{margin-top:14px;color:#aeb4bc;font-size:9px;letter-spacing:.08em}
.version{color:#c3c7cc;font-size:9px;margin-top:8px}
@media(max-width:390px){
  .app-header-inner{padding:calc(16px + env(safe-area-inset-top,0px)) 15px 16px}
  main{padding:34px 12px 40px}
  .field{padding:13px 14px}
  .number-input{width:108px}
  select{font-size:16px}
  .summary-head{gap:12px}
  .summary h2{font-size:24px}
  .summary-language{--summary-gutter:14px}
  .summary-item{padding:14px var(--summary-gutter)}
  .sum-row.total{font-size:24px}
  .app-footer{margin-top:96px;padding-bottom:36px}
  .app-footer img{width:40px}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="app-header-inner">料金計算機(アーティスト用)</div>
</header>
<main>
<div id="tattoos"></div>

<section class="summary">
  <div class="summary-head">
    <h2 id="summaryHeading" lang="en">Price</h2>
    <div class="summary-tabs" role="tablist" aria-label="料金の言語">
      <button id="summaryTabEn" class="summary-tab" type="button" role="tab" aria-selected="true" aria-controls="summaryPanelEn" data-heading="Price" data-lang="en">English</button>
      <button id="summaryTabJa" class="summary-tab" type="button" role="tab" aria-selected="false" aria-controls="summaryPanelJa" data-heading="料金" data-lang="ja">日本語</button>
    </div>
  </div>
  <div class="summary-panels">
    <section id="summaryPanelEn" class="summary-language" lang="en" role="tabpanel" aria-labelledby="summaryTabEn">
      <div id="summaryRowsEn"></div>
      <div class="summary-totals">
        <div class="sum-row"><span>Subtotal</span><strong id="subtotalEn">¥--,---</strong></div>
        <div id="discountRowEn" class="sum-row discount hidden"><span>Same-day Discount</span><strong>-¥5,000</strong></div>
        <div class="sum-row total"><span>Total</span><strong id="totalEn">¥--,---</strong></div>
      </div>
    </section>
    <section id="summaryPanelJa" class="summary-language" lang="ja" role="tabpanel" aria-labelledby="summaryTabJa" hidden>
      <div id="summaryRowsJa"></div>
      <div class="summary-totals">
        <div class="sum-row"><span>小計</span><strong id="subtotalJa">¥--,---</strong></div>
        <div id="discountRowJa" class="sum-row discount hidden"><span>同時施術割</span><strong>-¥5,000</strong></div>
        <div class="sum-row total"><span>お支払い合計</span><strong id="totalJa">¥--,---</strong></div>
      </div>
    </section>
  </div>
</section>

<footer class="app-footer">
  <img src="assets/mea-logo-white-bg.png" alt="Mea Tattoo Studio" width="633" height="362">
  <div class="copyright">© Mea Tattoo Studio</div>
  <div class="version">Version 0.3.24</div>
</footer>
</main>

<template id="tattooTemplate">
<section class="tattoo">
  <div class="tattoo-head">
    <div class="tattoo-title"></div>
    <div class="tattoo-actions">
      <button class="text-btn remove" type="button">削除</button>
    </div>
  </div>

  <section class="field dimension-field">
    <div class="dimension-row">
      <h2>長辺</h2>
      <div class="number-wrap"><input class="number-input long" type="number" min="1" max="300" step="1" inputmode="numeric" placeholder="80" aria-label="長辺（入力例 80mm）"><span class="unit">mm</span></div>
    </div>
    <div class="helper longHelp"></div>
  </section>

  <section class="field dimension-field">
    <div class="dimension-row">
      <h2>短辺</h2>
      <div class="number-wrap"><span class="current-ratio shortRatio hidden"></span><input class="number-input short" type="number" min="1" max="300" step="1" inputmode="numeric" placeholder="50" aria-label="短辺（入力例 50mm）"><span class="unit">mm</span></div>
    </div>
    <div class="helper shortHelp"></div>
    <div class="validation hidden">短辺は長辺以下になるように設定してください。</div>
  </section>

  <section class="field">
    <h2>複数モチーフの場合の余白</h2>
    <select class="whitespace">
      <option value="">---</option>
      <option value="notApplicable">該当なし</option>
      <option value="large">ほとんど大部分が余白（70%以上）</option>
      <option value="half">半分ほどが余白（50%前後）</option>
      <option value="some">少し余白（20〜30%）</option>
      <option value="none">余白なし（0〜10%）</option>
    </select>
    <div class="helper whitespaceHelp"></div>
  </section>

  <section class="field">
    <h2>デザインの複雑さ</h2>
    <select class="complexity">
      <option value="">---</option>
      <option value="verySimple">非常にシンプル</option>
      <option value="simple">シンプル</option>
      <option value="standard">標準</option>
      <option value="complex">複雑</option>
      <option value="veryComplex">非常に複雑</option>
    </select>
    <div class="examples">
      <div class="examples-title">例</div>
      <div class="example-row"><strong>とてもシンプル</strong><span class="example-dots">･･･</span><span>直線が数本 / ハートのみ</span></div>
      <div class="example-row"><strong>シンプル</strong><span class="example-dots">･･･</span><span>シンプルなラインのみ / レタリング</span></div>
      <div class="example-row"><strong>標準</strong><span class="example-dots">･･･</span><span>一般的なラインワーク / パッキングのみ / 少しシェーディング</span></div>
      <div class="example-row"><strong>複雑</strong><span class="example-dots">･･･</span><span>描き込みが多い / 半分シェーディング</span></div>
      <div class="example-row"><strong>とても複雑</strong><span class="example-dots">･･･</span><span>リアリスティック / 描き込みが非常に多い / フルカラー / フルシェーディング</span></div>
    </div>
    <div class="helper complexityHelp"></div>
  </section>

  <section class="field">
    <h2>カラー</h2>
    <select class="color">
      <option value="">---</option>
      <option value="oneToThree">1〜3色 または ブラック&グレー</option>
      <option value="fourToSix">4〜6色</option>
      <option value="sevenPlus">7色〜</option>
    </select>
    <div class="helper colorHelp"></div>
  </section>

  <div class="add-wrap"><button class="add" type="button">＋ 別のタトゥーを追加</button></div>
</section>
</template>

<script>
(()=>{
'use strict';

const money=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);
const inches=mm=>(mm/25.4).toFixed(1);
const signedMoney=n=>n>0?`+${money(n)}`:n<0?`-${money(Math.abs(n))}`:'±¥0';
const pct=n=>n>0?`+${n}%`:n<0?`${n}%`:'±0%';

const LABEL={
  shape:{veryNarrow:'とても細長い',narrow:'細長い',somewhat:'一般的な長方形',square:'正方形に近い'},
  whitespace:{notApplicable:'該当なし',large:'ほとんど大部分が余白',half:'半分ほどが余白',some:'少し余白',none:'余白なし'},
  complexity:{verySimple:'非常にシンプル',simple:'シンプル',standard:'標準',complex:'複雑',veryComplex:'非常に複雑'},
  color:{oneToThree:'1〜3色 / ブラック&グレー',fourToSix:'4〜6色',sevenPlus:'7色〜'}
};

const RATE={
  shape:{
    veryNarrow:{XS:-20,S:-20,M:-30,L:-30},
    narrow:{XS:0,S:-10,M:-15,L:-15},
    somewhat:{XS:0,S:0,M:-8,L:-8},
    square:{XS:0,S:0,M:0,L:0}
  },
  whitespace:{
    notApplicable:{XS:0,S:0,M:0,L:0},
    large:{XS:0,S:-30,M:-30,L:-30},
    half:{XS:0,S:-10,M:-15,L:-15},
    some:{XS:0,S:0,M:-10,L:-10},
    none:{XS:0,S:0,M:0,L:0}
  },
  complexity:{
    verySimple:{XS:0,S:-15,M:-15,L:-20},
    simple:{XS:0,S:0,M:-10,L:-15},
    standard:{XS:0,S:0,M:0,L:0},
    complex:{XS:0,S:10,M:5,L:5},
    veryComplex:{XS:10,S:15,M:10,L:25}
  },
  color:{
    oneToThree:{XS:0,S:0,M:0,L:0},
    fourToSix:{XS:0,S:5,M:5,L:10},
    sevenPlus:{XS:10,S:10,M:10,L:20}
  }
};

const BASE_BANDS=[
  {size:'XXS',min:1,max:9,price:13000},
  {size:'XS',min:10,max:44,price:17000},
  {size:'XS',min:45,max:49,price:22000},
  {size:'S',min:50,max:75,price:25000},
  {size:'S',min:76,max:90,price:33000},
  {size:'M',min:91,max:109,price:42000},
  {size:'M',min:110,max:150,price:52000},
  {size:'M',min:151,max:180,price:62000},
  {size:'L',min:181,max:230,price:80000}
];

function base(mm){
  const band=BASE_BANDS.find(x=>mm>=x.min&&mm<=x.max);
  return band?{...band}:{special:true};
}

function shapeFromRatio(r){
  if(r<=.34)return'veryNarrow';
  if(r<=.6)return'narrow';
  if(r<=.85)return'somewhat';
  return'square';
}

function rate(type,val,size){
  if(size==='XXS')return 0;
  return RATE[type]?.[val]?.[size]??0;
}

function amountFromRate(basePrice,rateValue){
  return Math.round(basePrice*rateValue/100);
}

function rowsHtml(_title,rows,currentKey){
  return rows.map(r=>{
    const parts=String(r.meta??'').split(' / ');
    const paired=parts.length>1;
    const rateText=paired?parts[0]:'';
    const amountText=paired?parts.slice(1).join(' / '):String(r.meta??'');
    return `<div class="helper-row${r.key===currentKey?' current':''}"><span>${r.label}</span><span class="rate">${rateText}</span><span class="amount">${amountText}</span></div>`;
  }).join('');
}

function baseBandsHtml(currentBand){
  return rowsHtml('基準料金一覧',BASE_BANDS.map((b,i)=>({
    key:String(i),
    label:`${b.min}〜${b.max}mm / ${b.size}`,
    meta:money(b.price)
  })), currentBand ? String(BASE_BANDS.findIndex(b=>b.min===currentBand.min&&b.max===currentBand.max)) : '');
}

function shapeRowsHtml(b,currentShape,currentRatio){
  const defs=[
    {key:'veryNarrow',label:'〜34% / とても細長い'},
    {key:'narrow',label:'35〜60% / 細長い'},
    {key:'somewhat',label:'61〜85% / 一般的な長方形'},
    {key:'square',label:'86〜100% / 正方形に近い'}
  ];
  const title=currentRatio==null?'形状補正一覧':`形状補正一覧（現在 ${currentRatio.toFixed(1)}%）`;
  return rowsHtml(title,defs.map(d=>{
    const r=b&&!b.special?rate('shape',d.key,b.size):null;
    return {key:d.key,label:d.label,meta:r==null?'—':`${pct(r)} / ${signedMoney(amountFromRate(b.price,r))}`};
  }),currentShape||'');
}

function optionRowsHtml(type,b,currentValue,priceBasis){
  const defs={
    whitespace:[
      {key:'large',label:'70%以上 / ほとんど大部分が余白'},
      {key:'half',label:'50%前後 / 半分ほどが余白'},
      {key:'some',label:'20〜30% / 少し余白'},
      {key:'none',label:'0〜10% / 余白なし'}
    ],
    complexity:[
      {key:'verySimple',label:'非常にシンプル'},
      {key:'simple',label:'シンプル'},
      {key:'standard',label:'標準'},
      {key:'complex',label:'複雑'},
      {key:'veryComplex',label:'非常に複雑'}
    ],
    color:[
      {key:'oneToThree',label:'1〜3色 / ブラック&グレー'},
      {key:'fourToSix',label:'4〜6色'},
      {key:'sevenPlus',label:'7色〜'}
    ]
  };
  const titles={whitespace:'余白補正一覧',complexity:'複雑さ補正一覧',color:'カラー補正一覧'};
  return rowsHtml(titles[type],defs[type].map(d=>{
    const r=b&&!b.special?rate(type,d.key,b.size):null;
    return {key:d.key,label:d.label,meta:r==null?'—':`${pct(r)} / ${signedMoney(amountFromRate(priceBasis??b.price,r))}`};
  }),currentValue||'');
}

const host=document.getElementById('tattoos');
const tpl=document.getElementById('tattooTemplate');
const summaryTabs=[...document.querySelectorAll('.summary-tab')];
const summaryHeading=document.getElementById('summaryHeading');

function selectSummaryLanguage(tab){
  summaryTabs.forEach(button=>{
    const selected=button===tab;
    button.setAttribute('aria-selected',String(selected));
    document.getElementById(button.getAttribute('aria-controls')).hidden=!selected;
  });
  summaryHeading.textContent=tab.dataset.heading;
  summaryHeading.lang=tab.dataset.lang;
}

summaryTabs.forEach(tab=>tab.addEventListener('click',()=>selectSummaryLanguage(tab)));

function addTattoo(){
  const card=tpl.content.firstElementChild.cloneNode(true);
  host.appendChild(card);
  bind(card);
  refresh();
  if(host.children.length>1)card.scrollIntoView({behavior:'smooth',block:'start'});
}

function bind(card){
  card.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>recalc(card)));
  card.querySelector('.remove').addEventListener('click',()=>{
    card.remove();
    refresh();
  });
  card.querySelector('.add').addEventListener('click',addTattoo);
  recalc(card);
}

function normalizeNumber(input){
  if(input.value.trim()==='')return null;
  const n=Number(input.value);
  if(!Number.isFinite(n))return null;
  return Math.max(1,Math.min(300,Math.round(n)));
}

function recalc(card){
  const long=normalizeNumber(card.querySelector('.long'));
  const short=normalizeNumber(card.querySelector('.short'));
  const b=long?base(long):null;
  const invalid=!long||!short||short>long;

  card.querySelector('.validation').classList.toggle('hidden',!long||!short||short<=long);
  card.querySelector('.longHelp').innerHTML=baseBandsHtml(b&&!b.special?b:null);

  let shape=null,shapeRate=0,currentRatio=null;
  if(long&&short&&!invalid&&b&&!b.special){
    currentRatio=(short/long)*100;
    shape=shapeFromRatio(short/long);
    shapeRate=rate('shape',shape,b.size);
  }
  const ratioLabel=card.querySelector('.shortRatio');
  ratioLabel.textContent=currentRatio==null?'':`現在 ${currentRatio.toFixed(1)}%`;
  ratioLabel.classList.toggle('hidden',currentRatio==null);
  card.querySelector('.shortHelp').innerHTML=shapeRowsHtml(b,shape,currentRatio);

  const whitespace=card.querySelector('.whitespace').value;
  const complexity=card.querySelector('.complexity').value;
  const color=card.querySelector('.color').value;

  let calc=null;
  if(!invalid&&b&&!b.special){
    const whitespaceRate=rate('whitespace',whitespace,b.size);
    const complexityRate=rate('complexity',complexity,b.size);
    const colorRate=rate('color',color,b.size);
    const afterShape=b.price*(1+shapeRate/100);
    const afterWhitespace=afterShape*(1+whitespaceRate/100);
    const afterComplexity=afterWhitespace*(1+complexityRate/100);
    const raw=afterComplexity*(1+colorRate/100);
    const rounded=Math.max(0,Math.round(raw/1000)*1000);
    calc={
      long,short,size:b.size,bandMin:b.min,bandMax:b.max,basePrice:b.price,
      shape,shapeRate,whitespace,whitespaceRate,complexity,complexityRate,color,colorRate,
      shapeAmount:afterShape-b.price,
      whitespaceAmount:afterWhitespace-afterShape,
      complexityAmount:afterComplexity-afterWhitespace,
      colorAmount:raw-afterComplexity,
      afterShape,afterWhitespace,afterComplexity,raw,rounded
    };
  }

  card.querySelector('.whitespaceHelp').innerHTML=optionRowsHtml('whitespace',b,whitespace,calc?.afterShape);
  card.querySelector('.complexityHelp').innerHTML=optionRowsHtml('complexity',b,complexity,calc?.afterWhitespace);
  card.querySelector('.colorHelp').innerHTML=optionRowsHtml('color',b,color,calc?.afterComplexity);

  card._calc=calc;
  card.dataset.special=b?.special?'1':'';
  refreshSummary();
}

const LABEL_EN={
  shape:{veryNarrow:'Very Elongated',narrow:'Elongated',somewhat:'Moderately Elongated',square:'Nearly Equal'},
  whitespace:{notApplicable:'Not applicable',large:'Mostly whitespace',half:'About half whitespace',some:'Some whitespace',none:'No whitespace'},
  complexity:{verySimple:'Very simple',simple:'Simple',standard:'Standard',complex:'Complex',veryComplex:'Very complex'},
  color:{oneToThree:'1–3 colors / Black & Grey',fourToSix:'4–6 colors',sevenPlus:'7+ colors'}
};

function breakdownLinesJa(c){
  return [
    {label:`${c.long} × ${c.short} mm`},
    {label:`形状：${LABEL.shape[c.shape]}`},
    c.whitespace==='notApplicable'
      ?{label:'余白：該当なし'}
      :c.whitespace
      ?{label:`余白：${LABEL.whitespace[c.whitespace]}`}
      :{label:'余白：未選択'},
    c.complexity
      ?{label:`複雑さ：${LABEL.complexity[c.complexity]}`}
      :{label:'複雑さ：未選択'},
    c.color
      ?{label:`カラー：${LABEL.color[c.color]}`}
      :{label:'カラー：未選択'}
  ];
}

function breakdownLinesEn(c){
  return [
    {label:`${c.long} × ${c.short} mm (${inches(c.long)} × ${inches(c.short)} in)`},
    {label:`Shape: ${LABEL_EN.shape[c.shape]}`},
    c.whitespace==='notApplicable'
      ?{label:'Whitespace: Not applicable'}
      :c.whitespace
      ?{label:`Whitespace: ${LABEL_EN.whitespace[c.whitespace]}`}
      :{label:'Whitespace: Not selected'},
    c.complexity
      ?{label:`Complexity: ${LABEL_EN.complexity[c.complexity]}`}
      :{label:'Complexity: Not selected'},
    c.color
      ?{label:`Color: ${LABEL_EN.color[c.color]}`}
      :{label:'Color: Not selected'}
  ];
}

function refresh(){
  const cards=[...host.querySelectorAll('.tattoo')];
  cards.forEach((card,i)=>{
    card.querySelector('.tattoo-title').textContent=`タトゥー #${i+1}`;
    card.querySelector('.remove').classList.toggle('hidden',cards.length===1);
    card.querySelector('.add-wrap').classList.toggle('hidden',i!==cards.length-1);
  });
  refreshSummary();
}

function refreshSummary(){
  const cards=[...host.querySelectorAll('.tattoo')];
  const languageSummaries=[
    {rows:document.getElementById('summaryRowsJa'),lines:breakdownLinesJa,title:i=>`タトゥー #${i+1}`,invalid:'入力内容を確認してください。',special:'自動計算対象外のサイズです。'},
    {rows:document.getElementById('summaryRowsEn'),lines:breakdownLinesEn,title:i=>`Tattoo #${i+1}`,invalid:'Please check the entered details.',special:'This size cannot be calculated automatically.'}
  ];
  languageSummaries.forEach(summary=>summary.rows.innerHTML='');

  let subtotal=0;
  let complete=true;

  cards.forEach((card,i)=>{
    const c=card._calc;
    if(!c)complete=false;
    else subtotal+=c.rounded;

    languageSummaries.forEach(summary=>{
      const item=document.createElement('div');
      item.className='summary-item';

      const detail=document.createElement('div');
      detail.className='summary-detail';
      const detailLines=c?summary.lines(c):[{label:card.dataset.special?summary.special:summary.invalid}];
      detailLines.forEach(entry=>{
        const line=document.createElement('div');
        line.className='summary-detail-line';
        const label=document.createElement('span');
        label.textContent=entry.label;
        line.appendChild(label);
        if(entry.value){
          const value=document.createElement('span');
          value.className='summary-detail-value';
          value.textContent=entry.value;
          line.appendChild(value);
        }
        detail.appendChild(line);
      });
      item.appendChild(detail);

      const main=document.createElement('div');
      main.className='summary-main';
      const title=document.createElement('span');
      title.textContent=summary.title(i);
      const amount=document.createElement('strong');
      amount.textContent=c?money(c.rounded):'¥--,---';
      main.append(title,amount);
      item.appendChild(main);
      summary.rows.appendChild(item);
    });
  });

  const discount=cards.length>=2?5000:0;
  ['Ja','En'].forEach(language=>{
    document.getElementById(`discountRow${language}`).classList.toggle('hidden',cards.length<2);
    document.getElementById(`subtotal${language}`).textContent=complete?money(subtotal):'¥--,---';
    document.getElementById(`total${language}`).textContent=complete?money(Math.max(0,subtotal-discount)):'¥--,---';
  });
}

addTattoo();
})();
</script>
</body>
</html>
