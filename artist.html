<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>料金計算機(アーティスト用)</title>
<meta name="apple-mobile-web-app-title" content="料金計算機(アーティスト用)">
<style>
:root{
  --bg:#fff;--card:#fff;--text:#111;--muted:#6b7280;--muted2:#9ca3af;
  --line:#e5e7eb;--soft:#f6f7f8;--soft2:#fafafa;--dark:#111827;
}
*{box-sizing:border-box}
html{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
body{margin:0}
main{max-width:760px;margin:auto;padding:24px 14px 40px}
h1{font-size:24px;line-height:1.25;margin:0 0 22px}
.tattoo{border-top:1px solid var(--line);padding-top:22px;margin-top:24px}
.tattoo:first-of-type{margin-top:0}
.tattoo-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.tattoo-title{font-size:19px;font-weight:800}
.tattoo-actions{display:flex;align-items:center;gap:14px}
.text-btn{border:0;background:transparent;color:#717780;font:inherit;font-size:12px;font-weight:600;padding:6px 0;cursor:pointer}
.text-btn.remove{color:#9a6b6b}
.field{border:1px solid var(--line);border-radius:4px;background:var(--card);padding:14px 16px;margin-top:10px}
.field h2{font-size:15px;font-weight:700;margin:0 0 9px}
.number-wrap{display:flex;align-items:center;gap:8px}
.number-input{width:120px;font:inherit;font-size:17px;font-weight:700;border:1px solid #d1d5db;border-radius:4px;background:#fff;padding:10px 11px;color:var(--text)}
.unit{font-size:12px;color:var(--muted);font-weight:600}
select{width:100%;font-size:15px;border:1px solid #d1d5db;border-radius:4px;background:#fff;padding:11px;color:var(--text)}
.helper{font-size:10.5px;color:#8a9099;line-height:1.5;margin-top:9px}
.helper-title{font-size:10px;font-weight:700;color:#777e87;margin-bottom:4px}
.helper-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:1px 0}
.helper-row.current{color:#555b63;font-weight:700}
.helper-row .meta{text-align:right;white-space:nowrap}
.validation{font-size:11px;color:#991b1b;margin-top:7px}
.hidden{display:none!important}
.pricebox{background:var(--soft);border:0;border-radius:6px;padding:15px 16px;margin-top:14px}
.price-kicker{font-size:11px;color:var(--muted);font-weight:700}
.price{font-size:23px;font-weight:800;margin-top:2px}
.add-wrap{display:flex;justify-content:center;margin:20px 0 0}
.add{border:0;background:#f1f2f4;color:#23262b;border-radius:6px;font:inherit;font-size:13px;font-weight:700;padding:11px 16px;cursor:pointer}
.summary{margin-top:40px;background:var(--soft2);border-radius:10px;padding:18px 16px}
.summary h2{font-size:18px;margin:0 0 14px}
.summary-languages{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.summary-language{min-width:0}
.summary-language-title{font-size:12px;font-weight:800;color:var(--muted);margin:0 2px 8px}
.summary-item{background:#fff;border-radius:7px;padding:13px 14px;margin-top:10px}
.summary-main{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:14px;font-weight:800}
.summary-detail{margin-top:7px;color:var(--muted2);font-size:10.5px;line-height:1.55}
.summary-detail div+div{margin-top:1px}
.summary-totals{margin-top:14px;padding-top:2px}
.sum-row{display:flex;justify-content:space-between;gap:14px;padding:6px 2px;font-size:13px}
.sum-row.discount{color:#6b7280}
.sum-row.total{margin-top:7px;padding-top:11px;font-size:18px;font-weight:800;border-top:1px solid #dfe2e6}
.payment{margin:14px 2px 0;color:#9aa0a8;font-size:10.5px;line-height:1.55}
.payment-title{font-weight:700;color:#8b9199}
.version{text-align:right;color:#c3c7cc;font-size:9px;margin-top:24px}
@media(max-width:390px){
  h1{font-size:22px}
  .tattoo-title{font-size:18px}
  .field{padding:13px 14px}
  .number-input{width:108px}
  .price{font-size:22px}
  .summary{padding:16px 13px}
  .summary-languages{grid-template-columns:1fr}
  .summary-language+.summary-language{margin-top:8px}
  .summary-item{padding:12px}
}
</style>
</head>
<body>
<main>
<h1>料金計算機(アーティスト用)</h1>

<div id="tattoos"></div>

<section class="summary">
  <h2>料金内訳</h2>
  <div class="summary-languages">
    <section class="summary-language" lang="ja">
      <h3 class="summary-language-title">日本語</h3>
      <div id="summaryRowsJa"></div>
      <div class="summary-totals">
        <div class="sum-row"><span>小計</span><strong id="subtotalJa">¥--,---</strong></div>
        <div id="discountRowJa" class="sum-row discount hidden"><span>同時施術割</span><strong>-¥5,000</strong></div>
        <div class="sum-row total"><span>お支払い合計</span><strong id="totalJa">¥--,---</strong></div>
      </div>
    </section>
    <section class="summary-language" lang="en">
      <h3 class="summary-language-title">English</h3>
      <div id="summaryRowsEn"></div>
      <div class="summary-totals">
        <div class="sum-row"><span>Subtotal</span><strong id="subtotalEn">¥--,---</strong></div>
        <div id="discountRowEn" class="sum-row discount hidden"><span>Same-day Discount</span><strong>-¥5,000</strong></div>
        <div class="sum-row total"><span>Total</span><strong id="totalEn">¥--,---</strong></div>
      </div>
    </section>
  </div>
  <div class="payment">
    <span class="payment-title">支払い時期：</span>
    1セッションは施術後に全額支払い。複数セッションは各セッションの施術後に、そのセッション分を支払い。
  </div>
</section>

<div class="version">artist-v0.3.2</div>
</main>

<template id="tattooTemplate">
<section class="tattoo">
  <div class="tattoo-head">
    <div class="tattoo-title"></div>
    <div class="tattoo-actions">
      <button class="text-btn reset" type="button">リセット</button>
      <button class="text-btn remove" type="button">削除</button>
    </div>
  </div>

  <section class="field">
    <h2>長辺</h2>
    <div class="number-wrap"><input class="number-input long" type="number" min="1" max="300" step="1" inputmode="numeric" value="80"><span class="unit">mm</span></div>
    <div class="helper longHelp"></div>
  </section>

  <section class="field">
    <h2>短辺</h2>
    <div class="number-wrap"><input class="number-input short" type="number" min="1" max="300" step="1" inputmode="numeric" value="50"><span class="unit">mm</span></div>
    <div class="helper shortHelp"></div>
    <div class="validation hidden">短辺は長辺以下になるように設定してください。</div>
  </section>

  <section class="field">
    <h2>複数モチーフの場合の余白</h2>
    <select class="whitespace">
      <option value="">該当なし / 選択してください</option>
      <option value="large">ほとんど大部分が余白（70%以上）</option>
      <option value="half">半分ほどが余白（50%前後）</option>
      <option value="some">少し余白（20〜30%）</option>
      <option value="none">余白なし（0〜10%）</option>
    </select>
    <div class="helper whitespaceHelp"></div>
  </section>

  <section class="field">
    <h2>デザインの複雑さ</h2>
    <select class="complexity">
      <option value="">選択してください</option>
      <option value="verySimple">非常にシンプル</option>
      <option value="simple">シンプル</option>
      <option value="standard">標準</option>
      <option value="complex">複雑</option>
      <option value="veryComplex">非常に複雑</option>
    </select>
    <div class="helper complexityHelp"></div>
  </section>

  <section class="field">
    <h2>カラー</h2>
    <select class="color">
      <option value="">選択してください</option>
      <option value="oneToThree">1〜3色 または ブラック&グレー</option>
      <option value="fourToSix">4〜6色</option>
      <option value="sevenPlus">7色〜</option>
    </select>
    <div class="helper colorHelp"></div>
  </section>

  <div class="pricebox">
    <div class="price-kicker">予想金額 / Estimated Price</div>
    <div class="price">¥--,---</div>
  </div>

  <div class="add-wrap"><button class="add" type="button">＋ 別のタトゥーを追加</button></div>
</section>
</template>

<script>
(()=>{
'use strict';

const money=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);
const signedMoney=n=>n>0?`+${money(n)}`:n<0?`-${money(Math.abs(n))}`:'±¥0';
const pct=n=>n>0?`+${n}%`:n<0?`${n}%`:'±0%';

const LABEL={
  shape:{veryNarrow:'とても細長い',narrow:'細長い',somewhat:'一般的な長方形',square:'正方形に近い'},
  whitespace:{large:'ほとんど大部分が余白',half:'半分ほどが余白',some:'少し余白',none:'余白なし'},
  complexity:{verySimple:'非常にシンプル',simple:'シンプル',standard:'標準',complex:'複雑',veryComplex:'非常に複雑'},
  color:{oneToThree:'1〜3色 / ブラック&グレー',fourToSix:'4〜6色',sevenPlus:'7色〜'}
};

const RATE={
  shape:{
    veryNarrow:{XS:-20,S:-20,M:-30,L:-30},
    narrow:{XS:0,S:-10,M:-15,L:-15},
    somewhat:{XS:0,S:0,M:-8,L:-8},
    square:{XS:0,S:0,M:0,L:0}
  },
  whitespace:{
    large:{XS:0,S:-30,M:-30,L:-30},
    half:{XS:0,S:-10,M:-15,L:-15},
    some:{XS:0,S:0,M:-10,L:-10},
    none:{XS:0,S:0,M:0,L:0}
  },
  complexity:{
    verySimple:{XS:0,S:-15,M:-15,L:-20},
    simple:{XS:0,S:0,M:-10,L:-15},
    standard:{XS:0,S:0,M:0,L:0},
    complex:{XS:0,S:10,M:5,L:5},
    veryComplex:{XS:10,S:15,M:10,L:25}
  },
  color:{
    oneToThree:{XS:0,S:0,M:0,L:0},
    fourToSix:{XS:0,S:5,M:5,L:10},
    sevenPlus:{XS:10,S:10,M:10,L:20}
  }
};

const BASE_BANDS=[
  {size:'XXS',min:1,max:9,price:13000},
  {size:'XS',min:10,max:44,price:17000},
  {size:'XS',min:45,max:49,price:22000},
  {size:'S',min:50,max:75,price:25000},
  {size:'S',min:76,max:90,price:33000},
  {size:'M',min:91,max:109,price:42000},
  {size:'M',min:110,max:150,price:52000},
  {size:'M',min:151,max:180,price:62000},
  {size:'L',min:181,max:230,price:80000}
];

function base(mm){
  const band=BASE_BANDS.find(x=>mm>=x.min&&mm<=x.max);
  return band?{...band}:{special:true};
}

function shapeFromRatio(r){
  if(r<=.34)return'veryNarrow';
  if(r<=.6)return'narrow';
  if(r<=.85)return'somewhat';
  return'square';
}

function rate(type,val,size){
  if(size==='XXS')return 0;
  return RATE[type]?.[val]?.[size]??0;
}

function amountFromRate(basePrice,rateValue){
  return Math.round(basePrice*rateValue/100);
}

function rowsHtml(title,rows,currentKey){
  return `<div class="helper-title">${title}</div>`+rows.map(r=>
    `<div class="helper-row${r.key===currentKey?' current':''}"><span>${r.label}</span><span class="meta">${r.meta}</span></div>`
  ).join('');
}

function baseBandsHtml(currentBand){
  return rowsHtml('基準料金一覧',BASE_BANDS.map((b,i)=>({
    key:String(i),
    label:`${b.min}〜${b.max}mm / ${b.size}`,
    meta:money(b.price)
  })), currentBand ? String(BASE_BANDS.findIndex(b=>b.min===currentBand.min&&b.max===currentBand.max)) : '');
}

function shapeRowsHtml(b,currentShape,currentRatio){
  const defs=[
    {key:'veryNarrow',label:'〜34% / とても細長い'},
    {key:'narrow',label:'35〜60% / 細長い'},
    {key:'somewhat',label:'61〜85% / 一般的な長方形'},
    {key:'square',label:'86〜100% / 正方形に近い'}
  ];
  const title=currentRatio==null?'形状補正一覧':`形状補正一覧（現在 ${currentRatio.toFixed(1)}%）`;
  return rowsHtml(title,defs.map(d=>{
    const r=b&&!b.special?rate('shape',d.key,b.size):null;
    return {key:d.key,label:d.label,meta:r==null?'—':`${pct(r)} / ${signedMoney(amountFromRate(b.price,r))}`};
  }),currentShape||'');
}

function optionRowsHtml(type,b,currentValue){
  const defs={
    whitespace:[
      {key:'large',label:'70%以上 / ほとんど大部分が余白'},
      {key:'half',label:'50%前後 / 半分ほどが余白'},
      {key:'some',label:'20〜30% / 少し余白'},
      {key:'none',label:'0〜10% / 余白なし'}
    ],
    complexity:[
      {key:'verySimple',label:'非常にシンプル'},
      {key:'simple',label:'シンプル'},
      {key:'standard',label:'標準'},
      {key:'complex',label:'複雑'},
      {key:'veryComplex',label:'非常に複雑'}
    ],
    color:[
      {key:'oneToThree',label:'1〜3色 / ブラック&グレー'},
      {key:'fourToSix',label:'4〜6色'},
      {key:'sevenPlus',label:'7色〜'}
    ]
  };
  const titles={whitespace:'余白補正一覧',complexity:'複雑さ補正一覧',color:'カラー補正一覧'};
  return rowsHtml(titles[type],defs[type].map(d=>{
    const r=b&&!b.special?rate(type,d.key,b.size):null;
    return {key:d.key,label:d.label,meta:r==null?'—':`${pct(r)} / ${signedMoney(amountFromRate(b.price,r))}`};
  }),currentValue||'');
}

const host=document.getElementById('tattoos');
const tpl=document.getElementById('tattooTemplate');

function addTattoo(){
  const card=tpl.content.firstElementChild.cloneNode(true);
  host.appendChild(card);
  bind(card);
  refresh();
  if(host.children.length>1)card.scrollIntoView({behavior:'smooth',block:'start'});
}

function resetCard(card){
  card.querySelector('.long').value=80;
  card.querySelector('.short').value=50;
  card.querySelector('.whitespace').value='';
  card.querySelector('.complexity').value='';
  card.querySelector('.color').value='';
  recalc(card);
}

function bind(card){
  card.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>recalc(card)));
  card.querySelector('.reset').addEventListener('click',()=>resetCard(card));
  card.querySelector('.remove').addEventListener('click',()=>{
    card.remove();
    refresh();
  });
  card.querySelector('.add').addEventListener('click',addTattoo);
  recalc(card);
}

function normalizeNumber(input){
  const n=Number(input.value);
  if(!Number.isFinite(n))return null;
  return Math.max(1,Math.min(300,Math.round(n)));
}

function recalc(card){
  const long=normalizeNumber(card.querySelector('.long'));
  const short=normalizeNumber(card.querySelector('.short'));
  const b=long?base(long):null;
  const invalid=!long||!short||short>long;

  card.querySelector('.validation').classList.toggle('hidden',!long||!short||short<=long);
  card.querySelector('.longHelp').innerHTML=baseBandsHtml(b&&!b.special?b:null);

  let shape=null,shapeRate=0,currentRatio=null;
  if(long&&short&&!invalid&&b&&!b.special){
    currentRatio=(short/long)*100;
    shape=shapeFromRatio(short/long);
    shapeRate=rate('shape',shape,b.size);
  }
  card.querySelector('.shortHelp').innerHTML=shapeRowsHtml(b,shape,currentRatio);

  const whitespace=card.querySelector('.whitespace').value;
  const complexity=card.querySelector('.complexity').value;
  const color=card.querySelector('.color').value;

  card.querySelector('.whitespaceHelp').innerHTML=optionRowsHtml('whitespace',b,whitespace);
  card.querySelector('.complexityHelp').innerHTML=optionRowsHtml('complexity',b,complexity);
  card.querySelector('.colorHelp').innerHTML=optionRowsHtml('color',b,color);

  let calc=null;
  if(!invalid&&b&&!b.special){
    const whitespaceRate=rate('whitespace',whitespace,b.size);
    const complexityRate=rate('complexity',complexity,b.size);
    const colorRate=rate('color',color,b.size);
    const totalRate=shapeRate+whitespaceRate+complexityRate+colorRate;
    const raw=b.price*(1+totalRate/100);
    const rounded=Math.max(0,Math.round(raw/1000)*1000);
    calc={
      long,short,size:b.size,bandMin:b.min,bandMax:b.max,basePrice:b.price,
      shape,shapeRate,whitespace,whitespaceRate,complexity,complexityRate,color,colorRate,
      totalRate,raw,rounded
    };
  }

  card._calc=calc;
  card.dataset.special=b?.special?'1':'';
  card.querySelector('.price').textContent=b?.special?'230mmを超えるサイズは自動計算できません。':(calc?money(calc.rounded):'¥--,---');
  refreshSummary();
}

const LABEL_EN={
  shape:{veryNarrow:'Very narrow',narrow:'Narrow',somewhat:'Rectangular',square:'Nearly square'},
  whitespace:{large:'Mostly whitespace',half:'About half whitespace',some:'Some whitespace',none:'No whitespace'},
  complexity:{verySimple:'Very simple',simple:'Simple',standard:'Standard',complex:'Complex',veryComplex:'Very complex'},
  color:{oneToThree:'1–3 colors / Black & Grey',fourToSix:'4–6 colors',sevenPlus:'7+ colors'}
};

function breakdownLinesJa(c){
  return [
    `${c.long} × ${c.short} mm / ${c.size}サイズ`,
    `基準価格 ${money(c.basePrice)}`,
    `形状：${LABEL.shape[c.shape]} ${pct(c.shapeRate)}（${signedMoney(amountFromRate(c.basePrice,c.shapeRate))}）`,
    c.whitespace
      ?`余白：${LABEL.whitespace[c.whitespace]} ${pct(c.whitespaceRate)}（${signedMoney(amountFromRate(c.basePrice,c.whitespaceRate))}）`
      :'余白：該当なし ±0%（±¥0）',
    c.complexity
      ?`複雑さ：${LABEL.complexity[c.complexity]} ${pct(c.complexityRate)}（${signedMoney(amountFromRate(c.basePrice,c.complexityRate))}）`
      :'複雑さ：未選択 ±0%（±¥0）',
    c.color
      ?`カラー：${LABEL.color[c.color]} ${pct(c.colorRate)}（${signedMoney(amountFromRate(c.basePrice,c.colorRate))}）`
      :'カラー：未選択 ±0%（±¥0）',
    `補正合計 ${pct(c.totalRate)} → ${money(Math.round(c.raw))} → ${money(c.rounded)}`
  ];
}

function breakdownLinesEn(c){
  return [
    `${c.long} × ${c.short} mm / ${c.size} size`,
    `Base ${money(c.basePrice)}`,
    `Shape: ${LABEL_EN.shape[c.shape]} ${pct(c.shapeRate)} (${signedMoney(amountFromRate(c.basePrice,c.shapeRate))})`,
    c.whitespace
      ?`Whitespace: ${LABEL_EN.whitespace[c.whitespace]} ${pct(c.whitespaceRate)} (${signedMoney(amountFromRate(c.basePrice,c.whitespaceRate))})`
      :'Whitespace: Not applicable ±0% (±¥0)',
    c.complexity
      ?`Complexity: ${LABEL_EN.complexity[c.complexity]} ${pct(c.complexityRate)} (${signedMoney(amountFromRate(c.basePrice,c.complexityRate))})`
      :'Complexity: Not selected ±0% (±¥0)',
    c.color
      ?`Color: ${LABEL_EN.color[c.color]} ${pct(c.colorRate)} (${signedMoney(amountFromRate(c.basePrice,c.colorRate))})`
      :'Color: Not selected ±0% (±¥0)',
    `Adjustment ${pct(c.totalRate)} → ${money(Math.round(c.raw))} → ${money(c.rounded)}`
  ];
}

function refresh(){
  const cards=[...host.querySelectorAll('.tattoo')];
  cards.forEach((card,i)=>{
    card.querySelector('.tattoo-title').textContent=`タトゥー${i+1}`;
    card.querySelector('.remove').classList.toggle('hidden',cards.length===1);
    card.querySelector('.add-wrap').classList.toggle('hidden',i!==cards.length-1);
  });
  refreshSummary();
}

function refreshSummary(){
  const cards=[...host.querySelectorAll('.tattoo')];
  const languageSummaries=[
    {rows:document.getElementById('summaryRowsJa'),lines:breakdownLinesJa,title:i=>`タトゥー${i+1}`,invalid:'入力内容を確認してください。',special:'自動計算対象外のサイズです。'},
    {rows:document.getElementById('summaryRowsEn'),lines:breakdownLinesEn,title:i=>`Tattoo ${i+1}`,invalid:'Please check the entered details.',special:'This size cannot be calculated automatically.'}
  ];
  languageSummaries.forEach(summary=>summary.rows.innerHTML='');

  let subtotal=0;
  let complete=true;

  cards.forEach((card,i)=>{
    const c=card._calc;
    if(!c)complete=false;
    else subtotal+=c.rounded;

    languageSummaries.forEach(summary=>{
      const item=document.createElement('div');
      item.className='summary-item';

      const main=document.createElement('div');
      main.className='summary-main';
      const title=document.createElement('span');
      title.textContent=summary.title(i);
      const amount=document.createElement('strong');
      amount.textContent=c?money(c.rounded):'¥--,---';
      main.append(title,amount);
      item.appendChild(main);

      const detail=document.createElement('div');
      detail.className='summary-detail';
      const detailLines=c?summary.lines(c):[card.dataset.special?summary.special:summary.invalid];
      detailLines.forEach(text=>{
        const line=document.createElement('div');
        line.textContent=text;
        detail.appendChild(line);
      });
      item.appendChild(detail);
      summary.rows.appendChild(item);
    });
  });

  const discount=cards.length>=2?5000:0;
  ['Ja','En'].forEach(language=>{
    document.getElementById(`discountRow${language}`).classList.toggle('hidden',cards.length<2);
    document.getElementById(`subtotal${language}`).textContent=complete?money(subtotal):'¥--,---';
    document.getElementById(`total${language}`).textContent=complete?money(Math.max(0,subtotal-discount)):'¥--,---';
  });
}

addTattoo();
})();
